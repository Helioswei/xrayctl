[package]
name = "xrayctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "个人自用 VPS 代理管理：Xray REALITY 的部署、用户、体检、流量账本、升级"
license = "MIT"
repository = "https://github.com/Helioswei/xrayctl"
default-run = "xrayctl"

[[bin]]
name = "xrayctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
